name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n vps.sh proxy.sh traffic.sh tests/traffic-mock-test.sh

      - name: Traffic mock tests
        run: bash tests/traffic-mock-test.sh
