name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: |
          bash -n vps install.sh lib/*.sh tests/*.sh

      - name: ShellCheck
        run: shellcheck -x vps install.sh

      - name: 测试
        run: bash tests/run.sh
