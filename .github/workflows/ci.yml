name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n vps.sh proxy.sh traffic.sh
          bash -n tests/*.sh

      - name: VPS menu tests
        run: bash tests/vps-menu-test.sh

      - name: Proxy menu tests
        run: bash tests/proxy-menu-test.sh

      - name: Traffic mock tests
        run: bash tests/traffic-mock-test.sh

      - name: Traffic menu tests
        run: bash tests/traffic-menu-test.sh

      - name: Menu UI tests
        run: bash tests/menu-ui-test.sh

      - name: Status UI tests
        run: bash tests/status-ui-test.sh

      - name: Integrity safety tests
        run: bash tests/integrity-safety-test.sh

      - name: ShellCheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x vps.sh proxy.sh traffic.sh || true
